name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Export production JS bundle
        run: npx expo export --platform android --output-dir dist

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/OneLeadQ-Floating-Assistant.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneLeadQ-Floating-Assistant-APK
          path: apk-output/OneLeadQ-Floating-Assistant.apk
          if-no-files-found: error
          retention-days: 14
